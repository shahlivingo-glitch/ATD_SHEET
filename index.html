<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Attendance">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Attendance</title>
<link rel="stylesheet" href="app.css?v=8">
</head>
<body>

<!-- Login -->
<section id="v-login" class="hidden">
  <div class="wrap">
    <div class="login-hero">
      <img class="logo" src="icon.svg" alt="">
      <h1 id="login-company">Staff Attendance</h1>
      <p class="muted">Log in once on your phone</p>
    </div>
    <form id="login-form" class="card stack" autocomplete="on">
      <div>
        <label for="emp-id">Employee ID</label>
        <input id="emp-id" type="text" autocapitalize="characters" autocomplete="username" required>
      </div>
      <div>
        <label for="emp-pin">PIN</label>
        <input id="emp-pin" type="password" inputmode="numeric" autocomplete="current-password" required>
      </div>
      <button class="btn block" type="submit">Log in</button>
    </form>
    <button class="btn ghost block install-btn hidden" style="margin-top:12px">Install app on this phone</button>
    <div class="brand-foot"><img src="tgra-mark.png" alt="">TGRA</div>
  </div>
</section>

<!-- Home -->
<section id="v-home" class="hidden">
  <header class="topbar">
    <h1 id="h-company">Attendance</h1>
    <button class="icon-btn" id="btn-refresh" title="Refresh"></button>
    <button class="icon-btn" id="btn-logout" title="Log out"></button>
  </header>
  <div class="wrap stack">
    <div class="card">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="flex:1;min-width:0">
          <h2 id="h-name" style="font-size:19px"></h2>
          <div class="muted small" id="h-meta"></div>
        </div>
        <div id="h-status"></div>
      </div>
      <div class="clock">
        <div class="time" id="clock-time">--:--</div>
        <div class="date" id="clock-date"></div>
      </div>
      <div class="shift-row" id="shift-row"></div>
    </div>

    <div id="notice"></div>
    <div class="actions" id="actions"></div>

    <div class="card hidden" id="team-card">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <h3 style="font-size:16px;flex:1">Other employees</h3>
        <button class="btn sm ghost" id="btn-group">Group selfie</button>
      </div>
      <p class="muted small" style="margin:0 0 10px" id="team-hint">Take the selfie for staff who don't have a phone.</p>
      <input type="text" id="team-search" placeholder="Search name or ID">
      <ul class="team" id="team-list"></ul>
      <div class="group-bar hidden" id="group-bar"></div>
    </div>

    <div class="card">
      <h3 style="font-size:16px;margin-bottom:10px">Today</h3>
      <div class="stats">
        <div><b id="st-worked">0m</b><span>Worked</span></div>
        <div><b id="st-lunch">0m</b><span>Lunch</span></div>
        <div><b id="st-late">0m</b><span>Late</span></div>
      </div>
      <ul class="timeline" id="timeline" style="margin-top:10px"></ul>
    </div>
    <button class="btn ghost block install-btn hidden">Install app on this phone</button>
    <div class="brand-foot"><img src="tgra-mark.png" alt="">TGRA</div>
  </div>
</section>

<!-- Camera -->
<section id="v-camera" class="cam hidden">
  <div class="cam-stage">
    <video id="video" playsinline muted autoplay></video>
    <canvas id="face-overlay" class="face-overlay"></canvas>
    <div class="face-status hidden" id="face-status"></div>
    <img id="preview" class="hidden" alt="Selfie preview">
    <div class="cam-top">
      <button class="icon-btn" id="cam-close" title="Cancel"></button>
      <div class="cam-title" id="cam-title">Check In</div>
      <div class="num small" id="cam-clock"></div>
      <button class="icon-btn" id="cam-flip" title="Switch camera"></button>
    </div>
    <div class="geo-box" id="geo-box"></div>
  </div>
  <div class="cam-bar shoot-bar" id="bar-shoot">
    <div class="zoom-ctl">
      <button class="zoom-btn" id="zoom-out" aria-label="Zoom out">−</button>
      <span class="zoom-val" id="zoom-val">1.0x</span>
      <button class="zoom-btn" id="zoom-in" aria-label="Zoom in">+</button>
    </div>
    <button class="shutter" id="btn-shoot" disabled aria-label="Take selfie"></button>
    <div class="auto-hint hidden" id="auto-hint"></div>
    <div></div>
  </div>
  <div class="cam-bar hidden" id="bar-confirm">
    <button class="btn ghost" id="btn-retake">Retake</button>
    <button class="btn" id="btn-submit">Submit</button>
  </div>
</section>

<!-- Done -->
<section id="v-done" class="hidden">
  <div class="wrap done">
    <div class="card">
      <img id="done-img" alt="Stamped selfie">
      <div class="done-check hidden" id="done-check">✓</div>
      <div class="big" id="done-title"></div>
      <p class="muted" id="done-sub"></p>
      <button class="btn block" id="btn-done">Done</button>
    </div>
  </div>
</section>

<canvas id="canvas" class="hidden"></canvas>

<script src="config.js?v=8"></script>
<script src="common.js?v=8"></script>
<script src="employee.js?v=8"></script>
</body>
</html>
